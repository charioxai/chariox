[package]
name = "spike-rust-async"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63.0"
serde_json = "1.0.140"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
