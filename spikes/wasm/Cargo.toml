# Spike only: not part of the product workspace or build.
[workspace]
resolver = "2"
members = ["worker", "worker-async", "harness", "async-probe/host"]

[workspace.dependencies]
chariox-app-runtime = { path = "../../packages/app-runtime" }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[profile.release]
debug = "line-tables-only"
