kind: connector
name: grpc_example
description: Public grpcb.in gRPC connector.
adapter: grpc
timeout_ms: 30000
max_response_bytes: 1048576
operations:
  - name: echo
    description: Call grpcb.in DummyUnary with typed fields.
    safety: read
    input_schema:
      type: object
      required: [message, number]
      properties:
        message:
          type: string
        number:
          type: integer
      additionalProperties: false
    config:
      address: grpcb.in:9000
      plaintext: true
      method: grpcbin.GRPCBin/DummyUnary
      data:
        fString: "{{message}}"
        fInt32: "{{number}}"
