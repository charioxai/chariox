kind: connector
name: mysql_example
description: Example MySQL connector.
adapter: mysql
credential:
  required: true
timeout_ms: 30000
max_response_bytes: 1048576
operations:
  - name: find_user
    description: Find a user by id.
    safety: read
    input_schema:
      type: object
      required: [id]
      properties:
        id:
          type: integer
      additionalProperties: false
    config:
      connection_url: mysql://127.0.0.1:3306/arroba
      query: "select id, email from users where id = ?"
      params:
        - "{{id}}"
