<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign refresh fixture</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <p>Campaign refresh fixture</p>
    <h1 id="campaign-title">Loading campaign</h1>
    <p id="campaign-body"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <label for="draft">Your draft</label>
    <textarea id="draft" rows="6" maxlength="4000" placeholder="Edits stay here during content refresh"></textarea>
  </main>
</body>
</html>
