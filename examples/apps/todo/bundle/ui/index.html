<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Todo</h1>
      <label class="filter"><input type="checkbox" id="open-only"> Open only</label>
    </header>
    <form id="new-todo" aria-label="New Todo">
      <input id="title" name="title" required maxlength="200" placeholder="What needs doing?" aria-label="Title">
      <input id="due" name="due" type="datetime-local" aria-label="Due (optional)">
      <button type="submit">Add</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="todos" aria-label="Todos"></ul>
  </main>
</body>
</html>
