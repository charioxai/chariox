name: App private ext4 storage (production helper fixture)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/app-runtime/src/worker_process/storage_linux*'
      - 'packages/app-runtime/src/worker_process/storage_linux/**'
      - 'packages/app-runtime/src/bin/chariox-app-storage.rs'
      - 'packages/app-runtime/src/private_fs*'
      - 'packages/app-runtime/src/private_fs/**'
      - 'deploy/managed-kernel/chariox-app-storage.service'
      - 'deploy/managed-kernel/chariox-managed-bootstrap.service'
      - 'scripts/*app-storage-linux*'
      - '.github/workflows/app-storage-linux.yml'
permissions:
  contents: read
concurrency:
  group: app-storage-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install small filesystem tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs util-linux
      - name: Compile and exercise the installed helper on fixed disposable images
        id: storage
        run: bash scripts/test-app-storage-linux-ci.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.storage.outputs.evidence != ''
        with:
          name: LINUX-EXT4-STORAGE-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.storage.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove owned compilation scratch
        if: always() && steps.storage.outputs.scratch != ''
        env:
          STORAGE_SCRATCH: ${{ steps.storage.outputs.scratch }}
        run: |
          storage_temp="$(realpath -e "$RUNNER_TEMP")"
          case "$STORAGE_SCRATCH" in
            "$storage_temp"/chariox-storage.*)
              sudo systemctl stop "chariox-storage-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service" >/dev/null 2>&1 || true
              sudo rm -rf -- "$STORAGE_SCRATCH"
              ;;
            *) exit 1 ;;
          esac
