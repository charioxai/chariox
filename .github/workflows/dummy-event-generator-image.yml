name: Dummy event generator image

on:
  workflow_dispatch:
  push:
    tags:
      - aegs-dummy-v*

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/aegs-dummy/Dockerfile
          build-args: ARROBA_BUILD_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/arroba-aegs-dummy:${{ github.sha }}
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/arroba-aegs-dummy
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
