name: App runtime bundle tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/app-worker/bundle.lock.json'
      - 'apps/app-worker/runtime.lock.json'
      - 'apps/app-worker/macos-build-profile.json'
      - 'apps/app-worker/src/bootstrap*.cjs'
      - 'packages/app-sdk/**'
      - 'scripts/package-app-runtime*.mjs'
      - 'scripts/app-runtime-bundle*.mjs'
      - 'scripts/build-app-runtime*.mjs'
      - 'scripts/app-runtime-ci-*.mjs'
      - 'scripts/app-runtime-macos-*'
      - 'scripts/run-app-runtime-*'
      - 'scripts/app-runtime-release*.mjs'
      - 'scripts/sign-app-runtime-release*.mjs'
      - '.github/workflows/app-runtime-bundle.yml'
      - '.github/workflows/app-runtime-native.yml'
      - '.github/workflows/app-runtime-macos-native.yml'

permissions:
  contents: read

concurrency:
  group: app-runtime-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify deterministic inventory and tampering cases
        run: node --test --test-concurrency=1 scripts/package-app-runtime.test.mjs
      - name: Verify external builder authority and signed release inventory
        run: node --test --test-concurrency=1 scripts/sign-app-runtime-release.test.mjs
