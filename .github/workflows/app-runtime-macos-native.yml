name: App runtime macOS native build (unsigned, manual)

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Explicitly admit one monitored macOS arm64 compilation (up to 300 minutes)'
        type: boolean
        required: true
        default: false
  # Pre-merge manual admission: adding this exact label is a one-shot event.
  # Labels already present never admit another build when the PR head changes.
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  # Wrong-target label events must not replace a queued manual Mac admission.
  group: app-runtime-native-darwin-arm64-${{ ((github.event_name == 'workflow_dispatch' && inputs.confirm_build == true) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'app-runtime-build-macos' && github.event.pull_request.head.repo.full_name == github.repository)) && 'build' || 'checks' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_build == true) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'app-runtime-build-macos' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      confirmed: ${{ steps.admit.outputs.confirmed }}
      source_sha: ${{ steps.admit.outputs.source_sha }}
      actor: ${{ steps.admit.outputs.actor }}
      admission_event: ${{ steps.admit.outputs.admission_event }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify explicit target event and current repository write permission
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/app-runtime-build-admission.mjs darwin-arm64
  build:
    if: needs.admission.outputs.confirmed == 'true'
    needs: admission
    runs-on: macos-15
    timeout-minutes: 330
    env:
      NATIVE_TARGET: darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admission.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11.9'
          architecture: arm64
      - name: Select the installed pinned Xcode without deleting or downloading SDKs
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Validate profile, provenance and owned command cancellation
        run: >-
          node --test --test-concurrency=1
          scripts/build-app-runtime.test.mjs scripts/app-runtime-ci-resources.test.mjs
          scripts/app-runtime-ci-receipt.test.mjs scripts/app-runtime-macos-build.test.mjs
          scripts/app-runtime-build-admission.test.mjs
          scripts/app-runtime-macos-command.test.mjs
          scripts/app-runtime-macos-preflight.test.mjs scripts/app-runtime-macos-watch.test.mjs
      - name: Compute exact target-specific native inputs
        id: inputs
        run: node scripts/app-runtime-ci-receipt.mjs key
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.inputs.outputs.path }}
          key: ${{ steps.inputs.outputs.key }}
          restore-keys: ${{ steps.inputs.outputs.prefix }}
      - name: Verify retained unsigned compilation evidence
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/app-runtime-ci-receipt.mjs check
      - name: Compile pinned Node and embedder with monitored reserves
        if: steps.reuse.outputs.reuse != 'true'
        id: native
        env:
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
          CHARIOX_NATIVE_BUILD_CONFIRMED: ${{ needs.admission.outputs.confirmed }}
          NATIVE_ADMITTED_SHA: ${{ needs.admission.outputs.source_sha }}
          NATIVE_ADMISSION_ACTOR: ${{ needs.admission.outputs.actor }}
          NATIVE_ADMISSION_EVENT: ${{ needs.admission.outputs.admission_event }}
        run: node scripts/run-app-runtime-macos-ci.mjs
      - uses: actions/upload-artifact@v4
        if: success() && steps.reuse.outputs.reuse != 'true'
        id: artifact
        with:
          name: UNSIGNED-NONRELEASE-darwin-arm64-${{ needs.admission.outputs.source_sha }}
          path: ${{ steps.native.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Record successful compilation and retained artifact
        if: success() && steps.reuse.outputs.reuse != 'true'
        env:
          NATIVE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          NATIVE_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: node scripts/app-runtime-ci-receipt.mjs save
      - uses: actions/cache/save@v4
        if: success() && steps.reuse.outputs.reuse != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.inputs.outputs.path }}
          key: ${{ steps.inputs.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.native.outputs.evidence != ''
        with:
          name: MACOS-NATIVE-RESOURCE-EVIDENCE-${{ needs.admission.outputs.source_sha }}
          path: ${{ steps.native.outputs.evidence }}
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only owned build scratch after artifact handling
        if: always() && steps.native.outputs.scratch != ''
        env:
          NATIVE_SCRATCH: ${{ steps.native.outputs.scratch }}
        run: |
          python3 -c 'import os,pathlib,re,shutil; p=pathlib.Path(os.environ["NATIVE_SCRATCH"]); root=pathlib.Path(os.environ["RUNNER_TEMP"]).resolve(); assert p.parent==root and re.fullmatch(r"chariox-macos-native\.[A-Za-z0-9]+",p.name) and not p.is_symlink(); shutil.rmtree(p)'
