# MP-07 / MP-08 / MP-11: build generic unsigned artifacts; owner signs and publishes.
name: Chariox Setup unsigned artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published signed CLI/kernel bundle version (semantic, without v)
        required: true
permissions:
  contents: read
jobs:
  unsigned:
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Focused installer tests (MP-07 / MP-11)
        if: matrix.target == 'linux-x64'
        run: node --test --test-concurrency=1 apps/setup/installer.test.mjs scripts/chariox-setup-install-script.test.mjs scripts/package-chariox-setup-linux.test.mjs
      - name: Compile generic Setup with public pins only (MP-07 / MP-11)
        env:
          VERSION: ${{ inputs.version }}
          PUBLIC_KEY: ${{ vars.CHARIOX_RELEASE_PUBLIC_KEY }}
        run: |
          node scripts/build-chariox-setup.mjs --version "$VERSION" --public-key "$PUBLIC_KEY" --target ${{ matrix.target }} --output "$RUNNER_TEMP/setup"
          "$RUNNER_TEMP/setup/chariox-setup" --version
      - name: macOS app skeleton (MP-07 / MP-11)
        if: matrix.target == 'darwin-arm64'
        run: node scripts/package-chariox-setup-macos.mjs "$RUNNER_TEMP/setup/chariox-setup" "$RUNNER_TEMP/setup/Chariox Setup.app"
      - name: Unsigned Linux package (MP-07 / MP-11)
        if: matrix.target == 'linux-x64'
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/package-chariox-setup-linux.mjs "$RUNNER_TEMP/setup/chariox-setup" "$RUNNER_TEMP/setup/chariox-setup.deb" "$VERSION"
      - name: Preserve executable modes (MP-07)
        run: tar -czf "$RUNNER_TEMP/chariox-setup-${{ matrix.target }}-unsigned.tar.gz" -C "$RUNNER_TEMP/setup" .
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-chariox-setup-${{ matrix.target }}
          path: ${{ runner.temp }}/chariox-setup-${{ matrix.target }}-unsigned.tar.gz
          retention-days: 7
