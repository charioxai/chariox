name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    if: github.event_name != 'pull_request' || github.event.label.name == 'program-final-ci'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared TypeScript packages
        run: pnpm build:kernel-client

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  rust:
    if: github.event_name != 'pull_request' || github.event.label.name == 'program-final-ci'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Performance drills
        run: node scripts/performance-drills.mjs

      - name: Client protocol conformance gate
        run: cargo test -p chariox-kernel client_protocol_conformance -- --nocapture

      - name: Release session project assignment regression
        run: cargo test --release -p chariox-kernel --lib visible_session_project_assignment_survives_release_builds -- --nocapture

      - name: Clippy
        run: |
          node --test scripts/clippy-changed-lines-gate.test.mjs
          node scripts/clippy-changed-lines-gate.mjs

      - name: Install official provider test harnesses
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.212 @openai/codex@0.144.0 opencode-ai@1.18.23
          test "$(claude --version)" = "2.1.212 (Claude Code)"
          test "$(codex --version)" = "codex-cli 0.144.0"
          test "$(opencode --version)" = "1.18.23"

      - name: Test
        run: cargo test --workspace
        env:
          RUST_MIN_STACK: 16777216
          RUST_TEST_THREADS: 1
