[package]
name = "chariox-event-protocol"
version = "0.1.0"
edition = "2021"
description = "Public Chariox event protocol types and validation"
license = "MIT"
repository = "https://github.com/charioxai/chariox"

[dependencies]
base64 = "0.22.1"
chariox-app-package = { path = "../app-package" }
serde_json_canonicalizer = "0.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
