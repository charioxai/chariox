[package]
name = "chariox-app-wasm-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Async component worker for kernel-owned App installations"

[dependencies]
libc = "0.2.172"
chariox-app-package = { path = "../app-package" }
chariox-app-runtime = { path = "../app-runtime" }
chariox-app-wit = { path = "../app-wit" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
futures = "0.3.31"
sha2 = "0.10.8"
tokio = { version = "1.44.2", features = ["io-util", "time", "sync", "macros", "net", "rt-multi-thread"] }
wasmtime = { version = "=50.0.0", default-features = false, features = ["std", "runtime", "cranelift", "component-model-async", "call-hook", "task-group-hook"] }

# Only the explicitly linked interfaces below are reachable; the HTTP crate's
# ambient socket/TLS transport is deliberately absent.
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-io = "=50.0.0"
wasmtime-wasi-http = { version = "=50.0.0", default-features = false, features = ["p2", "p3", "component-model-async"] }
bytes = "1.11.1"
http = "1.5.0"
http-body = "1.0.1"
http-body-util = "0.1.3"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["test-util"] }
wasm-compose = { version = "=0.261.0", default-features = false }
wit-parser = "=0.262.0"
wit-component = { version = "=0.262.0", features = ["dummy-module"] }
wasm-encoder = { version = "=0.262.0", features = ["wasmparser"] }
wasmparser = "=0.262.0"
wat = "=1.262.0"
