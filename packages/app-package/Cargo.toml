[package]
name = "chariox-app-package"
version = "0.1.0"
edition = "2021"
description = "Deterministic Chariox App package contracts and offline verification"
license = "MIT"
repository = "https://github.com/charioxai/chariox"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.1.1"
jsonschema = { version = "0.18.0", default-features = false }
semver = "1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.8"
tar = { version = "0.4.46", default-features = false }
url = "2.5.4"
