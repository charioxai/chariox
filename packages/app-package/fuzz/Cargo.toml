[package]
name = "chariox-app-package-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22.1"
chariox-app-package = { path = ".." }
ed25519-dalek = "2.1.1"
libfuzzer-sys = "0.4"
serde_json = "1.0.140"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.8"
tar = { version = "0.4.46", default-features = false }

# Not part of the repository workspace: built only by `cargo fuzz`.
[workspace]
members = ["."]

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed"
path = "fuzz_targets/signed.rs"
test = false
doc = false
bench = false
