[package]
name = "chariox-app-sdk-tools"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline component admission for App SDK builds"

[dependencies]
chariox-app-wit = { path = "../app-wit" }
anyhow = "1.0"
wasm-compose = "=0.262.0"
wasm-encoder = { version = "=0.262.0", features = ["wasmparser"] }
wasmparser = "=0.262.0"
wit-component = { version = "=0.262.0", features = ["dummy-module"] }
wit-parser = "=0.262.0"
wasmtime = { version = "=50.0.0", optional = true }
wasmtime-wasi = { version = "=50.0.0", optional = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"], optional = true }

[features]
component-drills = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:tokio"]

[dev-dependencies]
chariox-app-package = { path = "../app-package" }
ed25519-dalek = "2.1.1"
serde_json = "1.0.140"

[[bin]]
name = "chariox-app-component"
path = "src/main.rs"

[[test]]
name = "component-drill"
path = "tests/component-drill.rs"
required-features = ["component-drills"]

[[test]]
name = "excalidraw-files-drill"
path = "../../examples/apps/excalidraw/test/files-drill.rs"
required-features = ["component-drills"]
