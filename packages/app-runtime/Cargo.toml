[package]
name = "chariox-app-runtime"
version = "0.1.0"
edition = "2021"
description = "Kernel-owned Chariox App worker transport and lifecycle services"
license = "MIT"

[dependencies]
chariox-app-package = { path = "../app-package" }
libc = "0.2.172"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["io-util", "time", "sync", "macros", "net", "rt"] }

[dev-dependencies]
ed25519-dalek = "2.1.1"
tokio = { version = "1.44.2", features = ["macros", "rt", "test-util"] }
