[package]
name = "chariox-app-runtime"
version = "0.1.0"
edition = "2021"
description = "Kernel-owned Chariox App worker transport and lifecycle services"
license = "MIT"

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["io-util", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt", "test-util"] }
