[package]
name = "chariox-app-runtime-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Coverage-guided fuzzing (V-RUN-04): `cargo +nightly fuzz run wire_decode`
# from packages/app-runtime. Kept out of the main workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
chariox-app-runtime = { path = ".." }

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false
