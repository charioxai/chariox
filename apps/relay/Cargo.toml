[package]
name = "arroba-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.26.2"

[lib]
name = "arroba_relay"
path = "src/lib.rs"

[[bin]]
name = "arroba-relay"
path = "src/main.rs"
