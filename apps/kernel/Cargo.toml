[package]
name = "chariox-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
portable-pty = "0.8.1"
rand = "0.8"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
toml = "0.8.19"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.31"
wait-timeout = "0.2.0"
libc = "0.2.172"
jsonschema = "0.18.0"
tracing = "0.1.40"
hyper = { version = "1.6.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
http-body-util = "0.1.3"
bytes = "1.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
croner = "3.0.1"
chariox-relay = { path = "../relay" }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
flate2 = "1.0.35"
fs2 = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdh"] }
sha2 = "0.10.8"
tar = "0.4.43"
ureq = "2.12.1"
url = "2.5.4"
unicode-normalization = "0.1.24"
zeroize = "1.8.1"
ed25519-dalek = "2.1.1"
chariox-event-protocol = { path = "../../packages/event-protocol" }

[lib]
name = "chariox_kernel"
path = "src/lib.rs"

[[bin]]
name = "chariox-kernel"
path = "src/main.rs"

[[bin]]
name = "chariox-cli"
path = "src/bin/chariox-cli.rs"

[[bin]]
name = "chariox-managed-bootstrap"
path = "src/bin/chariox-managed-bootstrap.rs"
