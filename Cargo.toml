[workspace]
resolver = "2"
members = [
    "apps/kernel",
    "apps/relay",
    "apps/aegs-dummy",
    "packages/aegs-sdk",
    "packages/app-package",
    "packages/event-protocol",
    "packages/app-runtime",
    "adapters/rust",
]
# Vendored upstreams and scratch worktrees carry their own Cargo manifests;
# keep them out of this workspace.
exclude = [
    "packages/app-runtime/fuzz",
    "codex-main",
    "happy-main",
    "opencode-dev",
    "paseo",
    "host-worktree",
]

# A [workspace.lints] section warning on unwrap_used/expect_used is a natural
# next step, but it currently flags 2400+ pre-existing call sites; enabling it
# needs a dedicated cleanup pass (or per-site allows) first, so it is left out
# to keep `-D warnings` green.

# Every App start verifies the enrolled App runtime (its 119 MB libnode) and the
# App package with SHA-256. Unoptimized, sha2 hashes ~30 MB/s, which added ~4 s
# to every debug-kernel App cold start (0.24 s optimized). Optimize just sha2.
[profile.dev.package.sha2]
opt-level = 3
