name: amunblock-fa
x-drill-labels: &drill-labels
  io.chariox.drill.run: ${CHARIOX_DRILL_RUN:-}
  io.chariox.drill.started: ${CHARIOX_DRILL_STARTED:-}
  io.chariox.drill.harness: ${CHARIOX_DRILL_HARNESS:-}
  io.chariox.drill.process: ${CHARIOX_DRILL_PROCESS:-}

services:
  mailpit:
    labels: *drill-labels
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-amunblock-fa}-mailpit
    ports: ["127.0.0.1:${FA_PORT_MAIL_SMTP}:1025", "127.0.0.1:${FA_PORT_MAIL_UI}:8025"]
    mem_limit: 256m
  dex:
    labels: *drill-labels
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: ${COMPOSE_PROJECT_NAME:-amunblock-fa}-dex
    command: [dex, serve, /etc/dex/config.yaml]
    ports: ["127.0.0.1:${FA_PORT_OIDC}:5556"]
    volumes: ["${FA_STATE_DIR}/dex.yaml:/etc/dex/config.yaml:ro"]
    mem_limit: 256m
  postgres:
    labels: *drill-labels
    image: postgres:16.9-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-amunblock-fa}-postgres
    environment: {POSTGRES_USER: app, POSTGRES_DB: app, POSTGRES_PASSWORD: "${FA_DB_PASSWORD}"}
    ports: ["127.0.0.1:${FA_PORT_DB}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 512m
  stripe-mock:
    labels: *drill-labels
    image: stripe/stripe-mock:v0.197.0
    container_name: ${COMPOSE_PROJECT_NAME:-amunblock-fa}-stripe-mock
    ports: ["127.0.0.1:${FA_PORT_STRIPE}:12111"]
    mem_limit: 256m

networks:
  default:
    labels: *drill-labels

volumes:
  postgres-data:
    labels: *drill-labels
