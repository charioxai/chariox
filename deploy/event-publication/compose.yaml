name: chariox-event-publication

services:
  aeds:
    image: chariox-aeds:${CHARIOX_EVENT_IMAGE_TAG:-local}
    build:
      context: ../../../chariox-aeds
      dockerfile: Dockerfile
      args:
        CHARIOX_BUILD_REVISION: ${CHARIOX_BUILD_REVISION:-development}
    environment:
      CHARIOX_AEDS_KERNEL_ADDR: 0.0.0.0:43130
      CHARIOX_AEDS_PRODUCER_ADDR: 0.0.0.0:43131
      CHARIOX_AEDS_DATABASE_PATH: /var/lib/chariox/aeds/aeds.db
      CHARIOX_AEDS_KERNEL_TOKENS_FILE: /run/secrets/aeds_kernel_tokens
      CHARIOX_AEDS_PRODUCER_CAPABILITIES_FILE: /run/secrets/aeds_producer_capabilities
      CHARIOX_AEDS_RETRY_MS: "250"
      CHARIOX_AEDS_HEARTBEAT_MS: "1000"
    secrets:
      - aeds_kernel_tokens
      - aeds_producer_capabilities
    volumes:
      - aeds-data:/var/lib/chariox/aeds
    networks:
      - kernel-delivery
      - producer-delivery
    ports:
      - "127.0.0.1:${CHARIOX_AEDS_KERNEL_PORT:-43130}:43130"
      - "127.0.0.1:${CHARIOX_AEDS_PRODUCER_PORT:-43131}:43131"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:43131/readyz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M

  dummy-aegs:
    profiles: ["dummy"]
    image: chariox-aegs-dummy:${CHARIOX_EVENT_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: docker/aegs-dummy/Dockerfile
      args:
        CHARIOX_BUILD_REVISION: ${CHARIOX_BUILD_REVISION:-development}
    environment:
      CHARIOX_AEGS_ADDR: 0.0.0.0:43132
      CHARIOX_AEGS_PRODUCER_ID: dev.chariox.dummy
      CHARIOX_AEGS_PRODUCER_TOKEN_FILE: /run/secrets/dummy_aegs_producer_token
      CHARIOX_AEGS_MANAGEMENT_TOKEN_FILE: /run/secrets/dummy_aegs_management_token
      CHARIOX_AEGS_DATABASE_PATH: /var/lib/chariox/aegs/aegs.db
      CHARIOX_AEDS_EVENTS_URL: http://aeds:43131/v1/events
    secrets:
      - dummy_aegs_producer_token
      - dummy_aegs_management_token
    volumes:
      - dummy-aegs-data:/var/lib/chariox/aegs
    networks:
      - producer-delivery
    ports:
      - "127.0.0.1:${CHARIOX_DUMMY_AEGS_PORT:-43132}:43132"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    depends_on:
      aeds:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:43132/readyz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    deploy:
