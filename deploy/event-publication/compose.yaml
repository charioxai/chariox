name: arroba-event-publication

services:
  aeds:
    image: arroba-aeds:${ARROBA_EVENT_IMAGE_TAG:-local}
    build:
      context: ../../../arroba-aeds
      dockerfile: Dockerfile
      args:
        ARROBA_BUILD_REVISION: ${ARROBA_BUILD_REVISION:-development}
    environment:
      ARROBA_AEDS_KERNEL_ADDR: 0.0.0.0:43130
      ARROBA_AEDS_PRODUCER_ADDR: 0.0.0.0:43131
      ARROBA_AEDS_DATABASE_PATH: /var/lib/arroba/aeds/aeds.db
      ARROBA_AEDS_KERNEL_TOKENS_FILE: /run/secrets/aeds_kernel_tokens
      ARROBA_AEDS_PRODUCER_CAPABILITIES_FILE: /run/secrets/aeds_producer_capabilities
      ARROBA_AEDS_RETRY_MS: "250"
      ARROBA_AEDS_HEARTBEAT_MS: "1000"
    secrets:
      - aeds_kernel_tokens
      - aeds_producer_capabilities
    volumes:
      - aeds-data:/var/lib/arroba/aeds
    networks:
      - kernel-delivery
      - producer-delivery
    ports:
      - "127.0.0.1:${ARROBA_AEDS_KERNEL_PORT:-43130}:43130"
      - "127.0.0.1:${ARROBA_AEDS_PRODUCER_PORT:-43131}:43131"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:43131/readyz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M

  dummy-aegs:
    image: arroba-aegs-dummy:${ARROBA_EVENT_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: docker/aegs-dummy/Dockerfile
      args:
        ARROBA_BUILD_REVISION: ${ARROBA_BUILD_REVISION:-development}
    environment:
      ARROBA_AEGS_ADDR: 0.0.0.0:43132
      ARROBA_AEGS_PRODUCER_ID: dev.arroba.dummy
      ARROBA_AEGS_PRODUCER_TOKEN_FILE: /run/secrets/dummy_aegs_producer_token
      ARROBA_AEGS_MANAGEMENT_TOKEN_FILE: /run/secrets/dummy_aegs_management_token
      ARROBA_AEGS_DATABASE_PATH: /var/lib/arroba/aegs/aegs.db
      ARROBA_AEDS_EVENTS_URL: http://aeds:43131/v1/events
    secrets:
      - dummy_aegs_producer_token
      - dummy_aegs_management_token
    volumes:
      - dummy-aegs-data:/var/lib/arroba/aegs
    networks:
      - producer-delivery
    ports:
      - "127.0.0.1:${ARROBA_DUMMY_AEGS_PORT:-43132}:43132"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    depends_on:
      aeds:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:43132/readyz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    deploy:
