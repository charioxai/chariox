  github-aegs-data:
  jira-aegs-data:
  linear-aegs-data:
  gitlab-aegs-data:
  sentry-aegs-data:
  slack-aegs-data:

secrets:
  aeds_kernel_tokens:
    file: ./secrets/aeds-kernel-tokens.json
  aeds_producer_capabilities:
    file: ./secrets/aeds-producer-capabilities.json
  dummy_aegs_producer_token:
